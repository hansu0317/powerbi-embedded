<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qualisoft BI 포털</title>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/static/dist/app.css">
  <script>
    window.__BOOTSTRAP__ = {
      page: "report",
      data: {
        user: {
          username: {{ user.username | tojson }},
          display_name: {{ user.display_name | tojson }},
          is_admin: {{ (user.is_admin or False) | tojson }},
          can_upload: {{ (user.can_upload or False) | tojson }}
        },
        reports: {{ reports | tojson }},
        favorites: {{ favorites | tojson }},
        recents: {{ recents | tojson }},
        csrf_token: {{ csrf_token | tojson }},
        marketing_portal_url: {{ marketing_portal_url | tojson }},
        recents_limit: {{ recents_limit | tojson }}
      }
    };
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/static/dist/app.js"></script>
</body>
</html>
